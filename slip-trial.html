<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Garden Grow — Pay slip (TRIAL)</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--g:#1d5038;--g2:#2f7a57;--gold:#c9a84c;--bg:#f6f3ea;--card:#fff;--tx:#173626;--mut:#6a7466;--line:#ebe5d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.hd{background:linear-gradient(165deg,#21503a,#143524);color:#fff;padding:16px 16px 18px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px}
.hd img{width:48px;height:48px;border-radius:50%;background:#fff}
.hd b{display:block;font-size:17px}.hd small{opacity:.8;font-size:13px}
.wrap{max-width:460px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px -14px rgba(26,58,42,.5);margin-bottom:14px}
.who{font-size:20px;font-weight:800}.sub{color:var(--mut);font-size:14px;margin-top:2px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.row:last-child{border-bottom:0}.row span:last-child{font-weight:700;white-space:nowrap}
.row.minus span:last-child{color:#9b1c13}
.net{display:flex;justify-content:space-between;align-items:center;background:#e6f3ea;border-radius:14px;padding:14px;margin-top:10px}
.net span{font-weight:700}.net b{font-size:26px;color:var(--g)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.btn{display:block;width:100%;min-height:64px;border:0;border-radius:18px;background:linear-gradient(180deg,var(--g2),var(--g));color:#fff;font-size:20px;font-weight:800;box-shadow:0 8px 20px -10px rgba(29,80,56,.8)}
.btn:disabled{opacity:.6}
.ok{text-align:center;padding:22px 16px}.ok .big{font-size:56px}.ok b{display:block;font-size:22px;margin:6px 0}
.err{background:#fde3e0;color:#7a1b14;border-radius:14px;padding:14px;font-weight:700;margin-bottom:12px;font-size:15px}
.info{text-align:center;color:var(--mut);font-size:14px;margin-top:10px}
.spin{width:36px;height:36px;border:4px solid #d9d4c7;border-top-color:var(--g);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hd"><img src="icon-192.png" alt=""><div><b>Garden Grow</b><small>Landscaping &amp; Gardening L.L.C · Pay slip</small></div></div>
<div style="background:#c9a84c;color:#1a2a20;text-align:center;font-weight:800;padding:8px;font-size:14px">TRIAL — sample figures, nothing is saved</div><div class="wrap" id="app"><div class="spin"></div></div>
<script>
/* This page holds NO salary data: it reads one slip from the company's private Google Sheet
   using the secret code in the link (#t=…), and the employee confirms with his own phone's
   fingerprint / screen lock (WebAuthn). The phone never sends the fingerprint itself. */
const API='https://script.google.com/macros/s/AKfycbzUS9f8e0dMar585B7BW67tJRG2WL0REp3wIobT6zXH1SqshXDshKvMkWrVP4M0bIc/exec';
const app=document.getElementById('app');
const tok='trial';
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aed=n=>'AED '+(Math.round((+n||0)*100)/100).toLocaleString('en-US');
const when=ms=>new Date(ms).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'});
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
let cur=null,busy=false;
/* TRIAL page: no Google Sheet, sample figures only — the fingerprint step is real */
async function api(get,body){
  await new Promise(r=>setTimeout(r,400));
  if(get){const ch=b64u(crypto.getRandomValues(new Uint8Array(32)));return {ok:true,status:'sent',challenge:ch,rpId:location.hostname,slip:{month:'OCTOBER 2026',empNo:'EMP-000',name:'Trial Worker',desig:'Gardener',days:30,basic:1200,allowance:600,otH:10,otA:50,gross:1850,advance:200,recoverySource:'salary',due:300,withUs:0,net:1650}};}
  const ad=unb64u(body.authenticatorData);if(!(ad[32]&4))return {ok:false,error:'NOT_VERIFIED'};
  return {ok:true,confirmedAt:Date.now()};
}
function msg(t){app.innerHTML='<div class="card"><div class="err">'+t+'</div><div class="info">Garden Grow office: 058 208 2936</div></div>';}
function slipHTML(s){
  const rows=[['Days worked',(+s.days||0)+' days'],['Monthly salary',aed(s.basic)]];
  if(+s.allowance)rows.push(['Additional allowance',aed(s.allowance)]);
  if(+s.otA||+s.otH)rows.push(['Overtime ('+(+s.otH||0)+' h)',aed(s.otA)]);
  rows.push(['Gross',aed(s.gross)]);
  const minus=[];
  if(+s.advance&&s.recoverySource!=='withus')minus.push(['Advance recovery','− '+aed(s.advance)]);
  let h='<div class="card"><div class="who">'+E(s.name)+'</div><div class="sub">'+E(s.month)+' · '+E(s.empNo)+(s.desig?' · '+E(s.desig):'')+'</div><div style="margin-top:10px">';
  rows.forEach(r=>h+='<div class="row"><span>'+E(r[0])+'</span><span>'+E(r[1])+'</span></div>');
  minus.forEach(r=>h+='<div class="row minus"><span>'+E(r[0])+'</span><span>'+E(r[1])+'</span></div>');
  h+='</div><div class="net"><span>Net pay</span><b>'+E(aed(s.net))+'</b></div>';
  const extra=[];
  if(+s.due>0)extra.push('Advance still to pay back: '+aed(s.due));
  if(+s.withUs>0)extra.push('Money the company holds for you: '+aed(s.withUs));
  if(+s.withUs<0)extra.push('Money you owe the company: '+aed(-s.withUs));
  if(extra.length)h+='<div class="note">'+extra.map(E).join('<br>')+'</div>';
  return h+'</div>';
}
function render(){
  const s=cur.slip||{};
  if(cur.status==='confirmed'){
    app.innerHTML='<div class="card ok"><div class="big">✅</div><b>Confirmed</b><div class="sub">You confirmed this pay slip on<br>'+E(when(cur.confirmedAt))+'</div></div>'+slipHTML(s);
    return;
  }
  app.innerHTML=slipHTML(s)+'<div id="er"></div><button class="btn" id="go">👆 Confirm with fingerprint</button><div class="info">Check your slip. If it is correct, tap the button and put your finger on your phone\'s fingerprint sensor.</div>';
  document.getElementById('go').onclick=confirmFp;
}
async function load(){
  if(!tok){msg('This link is not complete. Please open the link the office sent you.');return;}
  try{cur=await api(true);}catch(e){msg('No internet connection. Please connect and open the link again.');return;}
  if(!cur||!cur.ok){msg(cur&&cur.error==='REPLACED'?'This pay slip was updated. Please ask the office for the new link.':'This link is not valid. Please ask the office.');return;}
  render();
}
function err(t){const e=document.getElementById('er');if(e)e.innerHTML='<div class="err">'+t+'</div>';}
async function confirmFp(again){
  if(busy)return;busy=true;const b=document.getElementById('go');b.disabled=true;b.textContent='⏳ Waiting for fingerprint…';
  try{
    if(!window.PublicKeyCredential||!navigator.credentials){err('This phone or browser cannot use the fingerprint. Please open the link in Google Chrome.');return;}
    try{if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable&&!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){err('Your phone has no fingerprint or screen lock set. Please set a fingerprint in your phone settings (Security), then try again.');return;}}catch(e){}
    const s=cur.slip||{};
    const uid=crypto.getRandomValues(new Uint8Array(16));
    let cred;
    try{
      cred=await navigator.credentials.create({publicKey:{
        challenge:unb64u(cur.challenge),rp:{name:'Garden Grow pay slip',id:cur.rpId||location.hostname},
        user:{id:uid,name:String(s.empNo||'staff'),displayName:String(s.name||'Staff')+' — '+String(s.month||'')},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged',requireResidentKey:false},
        attestation:'none',timeout:90000}});
    }catch(e){err(e&&e.name==='NotAllowedError'?'Not confirmed. Tap the button again and use your fingerprint.':'The fingerprint did not work on this phone ('+E(e&&e.name||'error')+'). Please ask the office.');return;}
    const resp=cred.response;
    const ad=resp.getAuthenticatorData?resp.getAuthenticatorData():null;
    if(!ad){err('Please update Google Chrome on your phone, then open the link again.');return;}
    b.textContent='⏳ Sending…';
    let r;try{r=await api(false,{op:'slipSign',t:tok,clientDataJSON:b64u(resp.clientDataJSON),authenticatorData:b64u(ad),phone:(navigator.userAgentData&&navigator.userAgentData.platform||'')+' '+(navigator.userAgent.match(/(Android [\d.]+|iPhone OS [\d_]+)/)||[''])[0]});}
    catch(e){err('No internet connection. Please connect and tap the button again.');return;}
    if(r&&r.ok){cur.status='confirmed';cur.confirmedAt=r.confirmedAt;render();return;}
    if(r&&r.error==='EXPIRED'&&again!==true){busy=false;await load();return confirmFp(true);}
    err(r&&r.error==='NOT_VERIFIED'?'The phone did not check your fingerprint. Please set a fingerprint lock on your phone and try again.':'Could not confirm ('+E(r&&r.error||'error')+'). Please ask the office.');
  }finally{busy=false;const b2=document.getElementById('go');if(b2){b2.disabled=false;b2.textContent='👆 Confirm with fingerprint';}}
}
load();
</script>
</body>
</html>
